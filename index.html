    <script>
      // Compatibility polyfill for environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var _fetch = originalFetch ? function() {
            return originalFetch.apply(window, arguments);
          } : undefined;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var protoFetch = proto.fetch || window.fetch;
              var _pFetch = protoFetch ? function() {
                return protoFetch.apply(window, arguments);
              } : undefined;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return _pFetch; },
                set: function(fn) { _pFetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
    <script>
      // Gracefully ignore benign network aborts, AbortError, and Vite HMR WebSocket connection errors per AI Studio environment constraints
      function isBenignError(errOrMsg) {
        if (!errOrMsg) return false;
        var msg = String(errOrMsg.message || errOrMsg || '');
        var name = String(errOrMsg.name || '');
        return (
          name === 'AbortError' ||
          msg.includes('signal is aborted without reason') ||
          msg.includes('The user aborted a request') ||
          msg.includes('aborted') ||
          msg.includes('WebSocket closed without opened') ||
          msg.includes('failed to connect to websocket')
        );
      }

      window.addEventListener('unhandledrejection', function(event) {
        if (event && isBenignError(event.reason)) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && (isBenignError(event.error) || isBenignError(event.message))) {
          event.preventDefault();
        }
      });
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(arg) { return String(arg && arg.message ? arg.message : arg); }).join(' ');
          if (
            joined.includes('[vite] failed to connect to websocket') ||
            joined.includes('WebSocket closed without opened') ||
            joined.includes('signal is aborted without reason') ||
            joined.includes('The user aborted a request')
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
